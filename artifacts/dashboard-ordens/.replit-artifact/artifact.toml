kind = "web"
previewPath = "/"
title = "Monitor de Ordens Planejadas"
version = "1.0.0"
id = "artifacts/dashboard-ordens"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22244

[services.development]
run = "pnpm --filter @workspace/dashboard-ordens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard-ordens", "run", "build" ]
publicDir = "artifacts/dashboard-ordens/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22244"
BASE_PATH = "/"
